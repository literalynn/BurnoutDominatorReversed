name: release

# A GitHub release for each new version at the top of CHANGELOG.md, with that entry as its notes and
# the files of a portable installation: BurnoutDominator.exe (Windows), BurnoutDominator.py (Linux
# and macOS) and source.zip, the project as the launcher downloads and updates it.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build BurnoutDominator.exe
        # The launcher's window (tools/launcher/, with raylib) and the first start's downloads, in one program.
        run: |
          cmake -S tools/launcher -B build/launcher -A x64
          cmake --build build/launcher --config Release
          Copy-Item build/launcher/Release/BurnoutDominator.exe .

      - name: Create the release if this version has none
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)
          if [ -z "$version" ]; then echo "No version heading in CHANGELOG.md"; exit 1; fi
          if gh release view "v$version" > /dev/null 2>&1; then echo "v$version already has a release"; exit 0; fi
          awk '/^## /{entry++; next} entry == 1' CHANGELOG.md > notes.md
          # The files as they are in the repository, whatever this runner's line-ending settings.
          git -c core.autocrlf=false archive --format=zip -o source.zip HEAD
          cp tools/portable/BurnoutDominator.py BurnoutDominator.py
          gh release create "v$version" --title "$version" --notes-file notes.md --target "$GITHUB_SHA" \
            BurnoutDominator.exe BurnoutDominator.py source.zip
